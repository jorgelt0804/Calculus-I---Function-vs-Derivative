&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;
  &lt;header&gt;
    &lt;h1&gt;Piecewise function explorer&lt;/h1&gt;
    &lt;p&gt;Build a function or a derivative piece by piece, each with its own domain. At every breakpoint the app checks continuity and compares the one-sided derivatives.&lt;/p&gt;
  &lt;/header&gt;

  &lt;div class=&quot;layout&quot;&gt;
    &lt;aside&gt;
      &lt;section&gt;
        &lt;h2&gt;What are you entering?&lt;/h2&gt;
        &lt;div class=&quot;seg&quot; role=&quot;radiogroup&quot; aria-label=&quot;Type of expression&quot;&gt;
          &lt;input type=&quot;radio&quot; name=&quot;mode&quot; id=&quot;modeF&quot; value=&quot;f&quot; checked&gt;
          &lt;label for=&quot;modeF&quot;&gt;A function f(x)&lt;/label&gt;
          &lt;input type=&quot;radio&quot; name=&quot;mode&quot; id=&quot;modeD&quot; value=&quot;d&quot;&gt;
          &lt;label for=&quot;modeD&quot;&gt;A derivative f′(x)&lt;/label&gt;
        &lt;/div&gt;
        

        &lt;div class=&quot;field&quot; id=&quot;oneBox&quot; hidden&gt;
          &lt;label for=&quot;expr&quot; id=&quot;exprLabel&quot;&gt;f(x) =&lt;/label&gt;
          &lt;input type=&quot;text&quot; id=&quot;expr&quot; value=&quot;x^3 - 3x&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;
        &lt;/div&gt;

        &lt;div class=&quot;field&quot; id=&quot;pwBox&quot;&gt;
          &lt;label id=&quot;pwLabel&quot;&gt;f(x) is defined by these pieces&lt;/label&gt;
          &lt;div class=&quot;pieces&quot; id=&quot;pieces&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; id=&quot;addPiece&quot;&gt;Add piece&lt;/button&gt;&lt;/div&gt;
          &lt;p class=&quot;hint&quot;&gt;Each piece needs its own domain. Choose [ or ] to include an endpoint and ( or ) to exclude it. Use -inf and inf for unbounded ends. A piece such as [2, 2] defines a single point.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;chips&quot; id=&quot;chips&quot; aria-label=&quot;Examples&quot;&gt;&lt;/div&gt;

        &lt;div class=&quot;field&quot;&gt;
          &lt;label&gt;Graphing interval [a, b]&lt;/label&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;input type=&quot;text&quot; id=&quot;a&quot; value=&quot;-2.5&quot; aria-label=&quot;Left endpoint a&quot; autocomplete=&quot;off&quot;&gt;
            &lt;input type=&quot;text&quot; id=&quot;b&quot; value=&quot;2.5&quot; aria-label=&quot;Right endpoint b&quot; autocomplete=&quot;off&quot;&gt;
          &lt;/div&gt;
          &lt;p class=&quot;hint&quot;&gt;Endpoints may use pi, for example -2pi or pi/2.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;field&quot; id=&quot;icBox&quot; hidden&gt;
          &lt;label&gt;Initial condition f(x₀) = C&lt;/label&gt;
          &lt;div class=&quot;row&quot;&gt;
            &lt;input type=&quot;text&quot; id=&quot;ax&quot; value=&quot;&quot; placeholder=&quot;x₀ (default a)&quot; aria-label=&quot;Anchor point x0&quot; autocomplete=&quot;off&quot;&gt;
            &lt;input type=&quot;text&quot; id=&quot;ac&quot; value=&quot;0&quot; aria-label=&quot;Value C&quot; autocomplete=&quot;off&quot;&gt;
          &lt;/div&gt;
          &lt;p class=&quot;hint&quot;&gt;A derivative determines f only up to a constant. This condition picks one member of the family f(x) + C.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;btnrow&quot;&gt;&lt;button class=&quot;btn primary&quot; id=&quot;go&quot;&gt;Graph&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;msg err&quot; id=&quot;err&quot; role=&quot;alert&quot;&gt;&lt;/div&gt;

      &lt;/section&gt;

      &lt;section&gt;
        &lt;h2&gt;Tangent line&lt;/h2&gt;

          &lt;button class=&quot;btn&quot; id=&quot;play&quot; aria-pressed=&quot;false&quot;&gt;Play&lt;/button&gt;
          &lt;button class=&quot;btn&quot; id=&quot;reset&quot;&gt;Start at a&lt;/button&gt;

            &lt;select id=&quot;speed&quot;&gt;&lt;option value=&quot;0.5&quot;&gt;0.5×&lt;/option&gt;&lt;option value=&quot;1&quot; selected&gt;1×&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2×&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;4×&lt;/option&gt;&lt;/select&gt;
          &lt;/span&gt;
        &lt;/div&gt;
        &lt;dl class=&quot;readout&quot; id=&quot;readout&quot;&gt;

          &lt;dt&gt;f(c)&lt;/dt&gt;&lt;dd id=&quot;ry&quot;&gt;–&lt;/dd&gt;
          &lt;dt&gt;f′(c), slope&lt;/dt&gt;&lt;dd id=&quot;rm&quot;&gt;–&lt;/dd&gt;

        &lt;/dl&gt;
        &lt;div class=&quot;behavior&quot; id=&quot;rbeh&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;hint&quot;&gt;Click or drag on either graph to move the point of tangency. Near a breakpoint the point snaps onto it.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section&gt;
        &lt;details&gt;
          &lt;summary&gt;How to type expressions&lt;/summary&gt;
          &lt;ul&gt;
            &lt;li&gt;Use &lt;code&gt;x&lt;/code&gt; as the variable. Implied multiplication works: &lt;code&gt;3x^2&lt;/code&gt;, &lt;code&gt;2sin(x)&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;Powers &lt;code&gt;x^(1/2)&lt;/code&gt;, roots &lt;code&gt;sqrt(x)&lt;/code&gt;, real cube root &lt;code&gt;cbrt(x)&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;&lt;code&gt;e^x&lt;/code&gt; or &lt;code&gt;exp(x)&lt;/code&gt;; natural log &lt;code&gt;ln(x)&lt;/code&gt;; base 10 &lt;code&gt;log(x)&lt;/code&gt; or &lt;code&gt;log10(x)&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;Trig: &lt;code&gt;sin cos tan sec csc cot&lt;/code&gt;; inverses &lt;code&gt;arcsin arccos arctan&lt;/code&gt;.&lt;/li&gt;
            &lt;li&gt;Absolute value &lt;code&gt;abs(x)&lt;/code&gt;. Constants &lt;code&gt;pi&lt;/code&gt; and &lt;code&gt;e&lt;/code&gt;.&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/details&gt;
      &lt;/section&gt;
    &lt;/aside&gt;

    &lt;div class=&quot;plots&quot;&gt;
      &lt;figure&gt;
        &lt;figcaption&gt;
          &lt;span class=&quot;sw&quot; style=&quot;border-color:var(--f)&quot;&gt;&lt;/span&gt;
          &lt;span class=&quot;cap-title&quot; id=&quot;titleF&quot;&gt;f(x)&lt;/span&gt;
          &lt;span class=&quot;cap-sub&quot; id=&quot;subF&quot;&gt;&lt;/span&gt;
        &lt;/figcaption&gt;
        &lt;div class=&quot;canvas-box&quot;&gt;&lt;canvas id=&quot;cvF&quot; aria-label=&quot;Graph of f with tangent line&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
      &lt;/figure&gt;

    head.innerHTML = &#x27;&lt;tr&gt;&lt;th&gt;x&lt;/th&gt;&lt;th&gt;f(x)&lt;/th&gt;&lt;th&gt;Limit from left&lt;/th&gt;&lt;th&gt;Limit from right&lt;/th&gt;&lt;th&gt;Continuous&lt;/th&gt;&lt;th&gt;f′ from left&lt;/th&gt;&lt;th&gt;f′ from right&lt;/th&gt;&lt;th&gt;Differentiable&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;;
    for (const p of S.bps) {
      const r = S.bpInfo.get(p);
      const side = (has, cont, d) =&gt; !has ? &#x27;—&#x27; : (cont ? fmtN(d) : &#x27;does not exist&#x27;);
      rows += &#x27;&lt;tr&gt;&lt;td&gt;&#x27; + fmtN(p) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + fmtN(r.fp) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + (r.hasL ? fmtN(r.L) : &#x27;—&#x27;) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + (r.hasR ? fmtN(r.R) : &#x27;—&#x27;) + &#x27;&lt;/td&gt;&#x27;
        + yesNo(r.cont &amp;&amp; r.hasL &amp;&amp; r.hasR) + &#x27;&lt;td&gt;&#x27; + side(r.hasL, r.contL, r.dL) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + side(r.hasR, r.contR, r.dR) + &#x27;&lt;/td&gt;&#x27;
        + yesNo(r.kind === &#x27;smooth&#x27;) + &#x27;&lt;td&gt;&lt;button class=&quot;view&quot; data-x=&quot;&#x27; + p + &#x27;&quot;&gt;View&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    }
  } else {
    $(&#x27;bpNote&#x27;).textContent = &#x27;The reconstructed f is continuous wherever it is defined, because it is an integral. It is differentiable at a breakpoint only when the one-sided limits of f′ agree; a jump in f′ produces a corner in f.&#x27;;
    head.innerHTML = &#x27;&lt;tr&gt;&lt;th&gt;x&lt;/th&gt;&lt;th&gt;f(x)&lt;/th&gt;&lt;th&gt;f′ limit from left&lt;/th&gt;&lt;th&gt;f′ limit from right&lt;/th&gt;&lt;th&gt;f differentiable&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&#x27;;
    for (const p of S.bps) {
      const y = interp(S.antiXs, S.antiF, p);
      const r = analyzeD(S.pw, p, y);
      rows += &#x27;&lt;tr&gt;&lt;td&gt;&#x27; + fmtN(p) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + fmtN(y) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + (r.hasL ? fmtN(r.dL) : &#x27;—&#x27;) + &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + (r.hasR ? fmtN(r.dR) : &#x27;—&#x27;) + &#x27;&lt;/td&gt;&#x27;
        + yesNo(r.kind === &#x27;smooth&#x27;) + &#x27;&lt;td&gt;&lt;button class=&quot;view&quot; data-x=&quot;&#x27; + p + &#x27;&quot;&gt;View&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;;
    }
  }
  body.innerHTML = rows;
  body.querySelectorAll(&#x27;.view&#x27;).forEach(btn =&gt; btn.addEventListener(&#x27;click&#x27;, () =&gt; {
    pause(); ensureShown(); S.x0 = +btn.dataset.x; syncSlider(); render();
  }));
}

/* ---------- build ---------- */
function setMsg(id, text) { const el = $(id); el.textContent = text || &#x27;&#x27;; el.classList.toggle(&#x27;show&#x27;, !!text); }

function build() {
  setMsg(&#x27;err&#x27;, &#x27;&#x27;); setMsg(&#x27;warn&#x27;, &#x27;&#x27;);
  pause();
  try {
    const wantDeriv = S.mode === &#x27;f&#x27;;
    let pieces;
    if (S.form === &#x27;one&#x27;) {
      try { pieces = [Object.assign(compilePiece($(&#x27;expr&#x27;).value, wantDeriv), { lo: -Infinity, hi: Infinity, lc: false, hc: false, loTxt: &#x27;\u2212\u221e&#x27;, hiTxt: &#x27;\u221e&#x27; })]; }
      catch (e) { throw new Error(e.message.charAt(0).toUpperCase() + e.message.slice(1)); }
    } else pieces = readPieceRows(wantDeriv);
    const pw = makePW(pieces);
    const a = numParse($(&#x27;a&#x27;).value, &#x27;The left endpoint a&#x27;);
    const b = numParse($(&#x27;b&#x27;).value, &#x27;The right endpoint b&#x27;);
    if (!(a &lt; b)) throw new Error(&#x27;The graphing interval needs a &lt; b.&#x27;);
    const bps = S.form === &#x27;pw&#x27; ? breakpointsOf(pw, a, b) : [];
    const warns = [];
    if (S.form === &#x27;pw&#x27; &amp;&amp; gapWarning(pw, a, b, bps)) warns.push(&#x27;Part of [a, b] is not covered by any piece, so the function is undefined there.&#x27;);
    S.a = a; S.b = b; S.pw = pw; S.bps = bps; S.bpInfo = new Map();
    const pwText = pieces.map(p =&gt; p.disp + (S.form === &#x27;pw&#x27; ? &#x27; if &#x27; + cond(p) : &#x27;&#x27;)).join(&#x27;;  &#x27;);
    let note;

    if (S.mode === &#x27;f&#x27;) {
      const gF = pwGraph(pw, a, b, &#x27;fn&#x27;);
      if (!gF.segs.some(s =&gt; s.ys.some(Number.isFinite)) &amp;&amp; !gF.closed.length) throw new Error(&#x27;f has no real values on this interval.&#x27;);
      const gD = pwGraph(pw, a, b, &#x27;dfn&#x27;);
      for (const p of bps) {
        const r = analyzeF(pw, p);
        S.bpInfo.set(p, r);
        if (r.kind === &#x27;smooth&#x27;) gD.closed.push({ x: p, y: r.m });
      }
      S.segF = gF.segs; S.dotsF = { open: gF.open, closed: gF.closed };
      S.segD = gD.segs; S.dotsD = { open: gD.open, closed: gD.closed };
      $(&#x27;titleF&#x27;).textContent = &#x27;f(x) = &#x27; + pwText;
      $(&#x27;subF&#x27;).textContent = &#x27;&#x27;;
      const withD = pieces.filter(p =&gt; p.lo &lt; p.hi);
      const allSym = withD.every(p =&gt; p.ddisp);
      $(&#x27;titleD&#x27;).textContent = &#x27;f′(x) = &#x27; + withD.map(p =&gt; (p.ddisp || &#x27;numerical&#x27;) + (S.form === &#x27;pw&#x27; ? &#x27; if &#x27; + cond(p, true) : &#x27;&#x27;)).join(&#x27;;  &#x27;);
      $(&#x27;subD&#x27;).textContent = S.form === &#x27;pw&#x27; ? &#x27;on the open pieces; see the breakpoint table&#x27; : (allSym ? &#x27;symbolic derivative&#x27; : &#x27;computed numerically&#x27;);
      note = S.form === &#x27;pw&#x27;
        ? &#x27;Open circles mark endpoints not included in a piece; filled circles mark included points. On the f′ graph, a filled circle appears at a breakpoint only when f is differentiable there.&#x27;
        : &#x27;The derivative was found symbolically when possible. For a function with corners, such as abs(x), switch to Piecewise to see the breakpoint analysis.&#x27;;
    } else {
      const x0 = $(&#x27;ax&#x27;).value.trim() === &#x27;&#x27; ? a : numParse($(&#x27;ax&#x27;).value, &#x27;The point x₀&#x27;);
      const C = numParse($(&#x27;ac&#x27;).value, &#x27;The value C&#x27;);
      if (x0 &lt; a || x0 &gt; b) throw new Error(&#x27;The point x₀ must lie in [a, b].&#x27;);
      const r = buildAnti(pw, a, b, x0, C, bps, 2400);
      if (!r.F.some((v, i) =&gt; Number.isFinite(v) &amp;&amp; r.xs[i] !== x0)) throw new Error(&#x27;f′ is undefined next to x₀, so f cannot be reconstructed. Choose a different x₀.&#x27;);
      if (r.broken) warns.push(&#x27;f′ is undefined somewhere in the interval. f is drawn only on the piece that contains x₀, because the integral cannot be carried across a point where f′ is undefined. Move x₀ to see another piece.&#x27;);
      S.antiXs = r.xs; S.antiF = r.F;
      S.segF = [{ xs: r.xs, ys: r.F }]; S.dotsF = { open: [], closed: [] };
      const gD = pwGraph(pw, a, b, &#x27;fn&#x27;);
      S.segD = gD.segs; S.dotsD = { open: gD.open, closed: gD.closed };
      for (const p of bps) S.bpInfo.set(p, true);
      $(&#x27;titleF&#x27;).textContent = &#x27;f(x) = &#x27; + fmtN(C) + &#x27; + ∫ f′(t) dt from &#x27; + fmtN(x0) + &#x27; to x&#x27;;
      $(&#x27;subF&#x27;).textContent = &#x27;one antiderivative, with f(&#x27; + fmtN(x0) + &#x27;) = &#x27; + fmtN(C);
      $(&#x27;titleD&#x27;).textContent = &#x27;f′(x) = &#x27; + pwText;
      $(&#x27;subD&#x27;).textContent = &#x27;as entered&#x27;;
      note = &#x27;f was reconstructed numerically with Simpson’s rule, with every breakpoint used as a grid node so no subinterval straddles a jump in f′. It is a graph, not a formula. Every other antiderivative is this graph shifted vertically; change C to see a different member of the family.&#x27;;
    }

    const vals = arr =&gt; arr.flatMap(s =&gt; s.ys);
    S.yF = yRange(vals(S.segF).concat(S.dotsF.open.map(d =&gt; d.y), S.dotsF.closed.map(d =&gt; d.y)));
    S.yD = yRange(vals(S.segD).concat(S.dotsD.open.map(d =&gt; d.y), S.dotsD.closed.map(d =&gt; d.y)));
    S.x0 = a + 0.3 * (b - a);
    S.ready = true;
    $(&#x27;note&#x27;).textContent = note;
    if (warns.length) setMsg(&#x27;warn&#x27;, warns.join(&#x27; &#x27;));
    syncSlider();
    renderTable();
    render();
  } catch (e) {
    setMsg(&#x27;err&#x27;, e.message || String(e));
  }
}

/* ---------- animation ---------- */
function syncSlider() { $(&#x27;pos&#x27;).value = Math.round((S.x0 - S.a) / (S.b - S.a) * 1000); }
function ensureShown() { if (!S.show) { S.show = true; $(&#x27;showTan&#x27;).checked = true; } }
function snap(x) {
  const tol = 0.006 * (S.b - S.a);
  let best = x, bd = Infinity;
  for (const p of S.bps) { const d = Math.abs(x - p); if (d &lt; tol &amp;&amp; d &lt; bd) { bd = d; best = p; } }
  return best;
}
function play() {
  if (!S.ready) return;
  ensureShown();
  if (S.x0 &gt;= S.b - 1e-12 * (S.b - S.a)) S.x0 = S.a;
  S.playing = true; S.lastT = 0; S.holdUntil = 0;
  $(&#x27;play&#x27;).textContent = &#x27;Pause&#x27;; $(&#x27;play&#x27;).setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
  S.raf = requestAnimationFrame(tick);
}
function pause() {
  S.playing = false; cancelAnimationFrame(S.raf);
  $(&#x27;play&#x27;).textContent = &#x27;Play&#x27;; $(&#x27;play&#x27;).setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
}
function tick(t) {
  if (!S.playing) return;
  if (!S.lastT) S.lastT = t;
  if (t &lt; S.holdUntil) { S.lastT = t; S.raf = requestAnimationFrame(tick); return; }
  const dt = Math.min(0.1, (t - S.lastT) / 1000);
  S.lastT = t;
  const dur = 12 / parseFloat($(&#x27;speed&#x27;).value);
  const prev = S.x0;
  let next = prev + (S.b - S.a) * dt / dur;
  if ($(&#x27;stopBp&#x27;).checked) {
    const hit = S.bps.find(p =&gt; p &gt; prev &amp;&amp; p &lt;= next);
    if (hit !== undefined) { next = hit; S.holdUntil = t + 1400; }
  }
  S.x0 = next;
  if (S.x0 &gt;= S.b &amp;&amp; S.holdUntil &lt;= t) {
    if ($(&#x27;loop&#x27;).checked) S.x0 = S.a;
    else { S.x0 = S.b; syncSlider(); render(); pause(); return; }
  }
  syncSlider(); render();
  S.raf = requestAnimationFrame(tick);
}

/* ---------- piece editor ---------- */
function addPieceRow(d) {
  d = d || { e: &#x27;&#x27;, lb: &#x27;(&#x27;, lo: &#x27;&#x27;, hi: &#x27;&#x27;, rb: &#x27;)&#x27; };
  const row = document.createElement(&#x27;div&#x27;);
  row.className = &#x27;piece&#x27;;
  row.innerHTML =
    &#x27;&lt;input type=&quot;text&quot; class=&quot;pe&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; placeholder=&quot;expression in x&quot; aria-label=&quot;Piece expression&quot;&gt;&#x27; +
    &#x27;&lt;div class=&quot;dom&quot;&gt;&lt;span&gt;on&lt;/span&gt;&#x27; +
    &#x27;&lt;select class=&quot;lb&quot; aria-label=&quot;Left endpoint included?&quot;&gt;&lt;option value=&quot;(&quot;&gt;(&lt;/option&gt;&lt;option value=&quot;[&quot;&gt;[&lt;/option&gt;&lt;/select&gt;&#x27; +
    &#x27;&lt;input type=&quot;text&quot; class=&quot;plo&quot; autocomplete=&quot;off&quot; aria-label=&quot;Left end of domain&quot; placeholder=&quot;-inf&quot;&gt;&#x27; +
    &#x27;&lt;span&gt;,&lt;/span&gt;&#x27; +
    &#x27;&lt;input type=&quot;text&quot; class=&quot;phi&quot; autocomplete=&quot;off&quot; aria-label=&quot;Right end of domain&quot; placeholder=&quot;inf&quot;&gt;&#x27; +
    &#x27;&lt;select class=&quot;rb&quot; aria-label=&quot;Right endpoint included?&quot;&gt;&lt;option value=&quot;)&quot;&gt;)&lt;/option&gt;&lt;option value=&quot;]&quot;&gt;]&lt;/option&gt;&lt;/select&gt;&#x27; +
    &#x27;&lt;button type=&quot;button&quot; class=&quot;rm&quot; aria-label=&quot;Remove this piece&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&#x27;;
  row.querySelector(&#x27;.pe&#x27;).value = d.e;
  row.querySelector(&#x27;.lb&#x27;).value = d.lb;
  row.querySelector(&#x27;.plo&#x27;).value = d.lo;
  row.querySelector(&#x27;.phi&#x27;).value = d.hi;
  row.querySelector(&#x27;.rb&#x27;).value = d.rb;
  row.querySelector(&#x27;.rm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (document.querySelectorAll(&#x27;#pieces .piece&#x27;).length &gt; 1) { row.remove(); relabel(); }
  });
  row.querySelectorAll(&#x27;input&#x27;).forEach(inp =&gt; inp.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Enter&#x27;) build(); }));
  $(&#x27;pieces&#x27;).appendChild(row);
  relabel();
  return row;
}
function relabel() {
  document.querySelectorAll(&#x27;#pieces .piece&#x27;).forEach((r, i) =&gt; r.querySelector(&#x27;.pe&#x27;).setAttribute(&#x27;aria-label&#x27;, &#x27;Piece &#x27; + (i + 1) + &#x27; expression&#x27;));
}
function loadPieces(list) { $(&#x27;pieces&#x27;).innerHTML = &#x27;&#x27;; list.forEach(addPieceRow); }

/* ---------- UI wiring ---------- */
function renderChips() {
  const box = $(&#x27;chips&#x27;); box.innerHTML = &#x27;&#x27;;
  const key = S.mode + &#x27;_&#x27; + S.form;
  PRESETS[key].forEach(p =&gt; {
    const btn = document.createElement(&#x27;button&#x27;);
    btn.className = &#x27;chip&#x27;; btn.type = &#x27;button&#x27;;
    btn.textContent = p.label || p.e.replace(/-/g, &#x27;\u2212&#x27;);
    btn.addEventListener(&#x27;click&#x27;, () =&gt; {
      if (S.form === &#x27;one&#x27;) $(&#x27;expr&#x27;).value = p.e; else loadPieces(p.pieces);
      $(&#x27;a&#x27;).value = p.a; $(&#x27;b&#x27;).value = p.b;
      if (S.mode === &#x27;d&#x27;) { $(&#x27;ax&#x27;).value = p.x0 || &#x27;&#x27;; $(&#x27;ac&#x27;).value = p.c || &#x27;0&#x27;; }
      build();
    });
    box.appendChild(btn);
  });
}
function applyPreset(p) {
  if (S.form === &#x27;one&#x27;) $(&#x27;expr&#x27;).value = p.e; else loadPieces(p.pieces);
  $(&#x27;a&#x27;).value = p.a; $(&#x27;b&#x27;).value = p.b;
  if (S.mode === &#x27;d&#x27;) { $(&#x27;ax&#x27;).value = p.x0 || &#x27;&#x27;; $(&#x27;ac&#x27;).value = p.c || &#x27;0&#x27;; }
}
function refreshLabels() {
  const sym = S.mode === &#x27;f&#x27; ? &#x27;f(x)&#x27; : &#x27;f′(x)&#x27;;
  $(&#x27;exprLabel&#x27;).textContent = sym + &#x27; =&#x27;;
  $(&#x27;pwLabel&#x27;).textContent = sym + &#x27; is defined by these pieces&#x27;;
  $(&#x27;icBox&#x27;).hidden = S.mode !== &#x27;d&#x27;;
  $(&#x27;oneBox&#x27;).hidden = S.form !== &#x27;one&#x27;;
  $(&#x27;pwBox&#x27;).hidden = S.form !== &#x27;pw&#x27;;
}
document.querySelectorAll(&#x27;input[name=mode]&#x27;).forEach(r =&gt; r.addEventListener(&#x27;change&#x27;, e =&gt; {
  if (!e.target.checked) return;
  S.mode = e.target.value; refreshLabels(); renderChips(); build();
}));
document.querySelectorAll(&#x27;input[name=form]&#x27;).forEach(r =&gt; r.addEventListener(&#x27;change&#x27;, e =&gt; {
  if (!e.target.checked) return;
  S.form = e.target.value; refreshLabels(); renderChips();
  if (S.form === &#x27;pw&#x27;) applyPreset(PRESETS[S.mode + &#x27;_pw&#x27;][S.mode === &#x27;f&#x27; ? 1 : 0]);
  build();
}));
$(&#x27;addPiece&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { addPieceRow().querySelector(&#x27;.pe&#x27;).focus(); });
$(&#x27;go&#x27;).addEventListener(&#x27;click&#x27;, build);
[&#x27;expr&#x27;, &#x27;a&#x27;, &#x27;b&#x27;, &#x27;ax&#x27;, &#x27;ac&#x27;].forEach(id =&gt; $(id).addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Enter&#x27;) build(); }));
$(&#x27;play&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; S.playing ? pause() : play());
$(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { if (!S.ready) return; pause(); ensureShown(); S.x0 = S.a; syncSlider(); render(); });
$(&#x27;pos&#x27;).addEventListener(&#x27;input&#x27;, e =&gt; {
  if (!S.ready) return;
  pause(); ensureShown();
  S.x0 = snap(S.a + (S.b - S.a) * (+e.target.value) / 1000);
  render();
});
$(&#x27;showTan&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { S.show = e.target.checked; if (!S.show) pause(); render(); });
$(&#x27;trace&#x27;).addEventListener(&#x27;change&#x27;, render);

function hookCanvas(cv) {
  const setFrom = e =&gt; {
    const r = cv.getBoundingClientRect();
    const pw = r.width - PAD.L - PAD.R;
    let t = (e.clientX - r.left - PAD.L) / pw;
    t = Math.max(0, Math.min(1, t));
    S.x0 = snap(S.a + t * (S.b - S.a));
    ensureShown(); syncSlider(); render();
  };
  cv.addEventListener(&#x27;pointerdown&#x27;, e =&gt; {
    if (!S.ready) return;
    pause();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    setFrom(e);
  });
  cv.addEventListener(&#x27;pointermove&#x27;, e =&gt; { if (S.ready &amp;&amp; cv.hasPointerCapture &amp;&amp; cv.hasPointerCapture(e.pointerId)) setFrom(e); });
}
hookCanvas($(&#x27;cvF&#x27;)); hookCanvas($(&#x27;cvD&#x27;));

if (window.ResizeObserver) new ResizeObserver(() =&gt; render()).observe(document.querySelector(&#x27;.plots&#x27;));
else window.addEventListener(&#x27;resize&#x27;, render);
try { window.matchMedia(&#x27;(prefers-color-scheme: dark)&#x27;).addEventListener(&#x27;change&#x27;, render); } catch (_) {}
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: [&#x27;data-theme&#x27;] });
if (document.fonts &amp;&amp; document.fonts.ready) document.fonts.ready.then(render);

applyPreset(PRESETS.f_pw[1]);
refreshLabels();
renderChips();
build();

})();

" hidden></iframe>
<script>
(function(){
  const frames=[document.getElementById('p1'),document.getElementById('p2')];
  const tabs=[document.getElementById('t1'),document.getElementById('t2')];
  function syncTheme(f){
    try{
      const d=f.contentDocument; if(!d||!d.documentElement) return;
      const t=document.documentElement.getAttribute('data-theme');
      if(t) d.documentElement.setAttribute('data-theme',t); else d.documentElement.removeAttribute('data-theme');
    }catch(_){}
  }
  function fit(f){
    try{
      const d=f.contentDocument; if(!d||!d.body) return;
      const h=Math.ceil(d.body.getBoundingClientRect().height)+4;
      if(h>50 && Math.abs(h-f.offsetHeight)>2) f.style.height=h+'px';
    }catch(_){}
  }
  frames.forEach(f=>{
    f.addEventListener('load',()=>{
      syncTheme(f); fit(f);
      try{ if(window.ResizeObserver) new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body); }catch(_){}
    });
  });
  function select(i){
    tabs.forEach((t,j)=>{ t.setAttribute('aria-selected',j===i?'true':'false'); t.tabIndex=j===i?0:-1; frames[j].hidden=j!==i; });
    requestAnimationFrame(()=>fit(frames[i]));
  }
  tabs.forEach((t,i)=>{
    t.addEventListener('click',()=>select(i));
    t.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ const k=(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length; select(k); tabs[k].focus(); e.preventDefault(); }
    });
  });
  new MutationObserver(()=>frames.forEach(syncTheme)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('resize',()=>frames.forEach(f=>{ if(!f.hidden) fit(f); }));
})();
</script>
